<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<style>
  /* Poe Market Zh:PoE 暗金風(與 PobTools 系列一致的深棕+金色系) */
  body {
    width: 300px;
    margin: 0;
    background: #1a1612;
    color: #cfc3a8;
    font: 13px/1.5 "Segoe UI", "Microsoft JhengHei", sans-serif;
    user-select: none;
  }
  header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid #4a3f2f;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  header .brand { display: flex; align-items: baseline; gap: 8px; }
  header .name { font-size: 18px; font-weight: 700; color: #debe84; letter-spacing: 0.5px; }
  header .ver { font-size: 11px; color: #7a6f5a; }
  header .tagline { font-size: 11px; color: #a99a7c; }
  main { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .lang-card { background: #211b14; border: 1px solid #4a3f2f; border-radius: 4px; padding: 8px 12px; text-align: center; }
  .lang-card .label { font-size: 11px; color: #a99a7c; letter-spacing: 1px; }
  .lang-select {
    width: 100%;
    margin-top: 6px;
    padding: 7px 8px;
    background: #2a241c;
    color: #ffe8b8;
    border: 1px solid #c9a66b;
    border-radius: 4px;
    font: 600 14px/1.3 inherit;
    font-family: inherit;
    cursor: pointer;
  }
  .lang-select option { background: #1a1612; color: #cfc3a8; }
  button {
    width: 100%;
    padding: 9px 0;
    background: #2a241c;
    color: #cfc3a8;
    border: 1px solid #4a3f2f;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #c9a66b; color: #ffe8b8; }
  button.armed { background: #6b5324; border-color: #c9a66b; color: #ffe8b8; }
  /* ⚠ 一定要留這條:HTML 的 hidden 屬性等於 display:none,但任何顯式的 display 宣告都會蓋掉它 */
  [hidden] { display: none !important; }
  #status { min-height: 18px; font-size: 12px; color: #8fae7a; white-space: pre-wrap; text-align: center; }
  #status.error { color: #c96b6b; }
</style>
</head>
<body>
  <!-- 2026-11-04 起點擴充圖示直接打開交易站側邊欄的 ⚙ 設定(manifest 沒有 default_popup),設定畫面都在側邊欄。
       這一頁只剩三種用途,都由背景開成分頁:全新安裝選語言(?ask=lang)、poe.ninja / pobb.in 授權退路(?ask=ninja / ?ask=pobbin,
       Firefox 不能在背景直接跳授權對話框)。沒帶 ask 打開時直接轉去交易站設定。 -->
  <header>
    <div class="brand">
      <span class="name">Poe Market Zh</span>
      <span class="ver" id="version"></span>
    </div>
    <div class="tagline" data-i18n="pop.tagline">PoE 交易站、pobb.in、poe.ninja 的中文輔助工具</div>
  </header>
  <main>
    <div class="lang-card" id="langCard" hidden>
      <div class="label" data-i18n="pop.uiLang">介面語言 / Language</div>
      <!-- 選項由 popup.js 依 shared/i18n.js 的語言清單產生(加語言不必改這裡) -->
      <select id="uiLangSel" class="lang-select" aria-label="Language"></select>
    </div>
    <!-- 授權鈕:chrome.permissions.request 只能從擴充頁面、在點擊當下呼叫 -->
    <button id="ninjaToggle" hidden><span data-i18n="pop.ninja">允許存取 poe.ninja</span></button>
    <button id="pobbinToggle" hidden><span data-i18n="pop.pobbin">允許存取 pobb.in</span></button>
    <button id="openSettings" hidden data-i18n="pop.openSettings">開啟交易站設定</button>
    <div id="status"></div>
  </main>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
